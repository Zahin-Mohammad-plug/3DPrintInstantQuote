version: '3.8'

services:
  prusa-slicer:
    container_name: prusa-slicer-container
    build: ./backend/prusa-slicer-server
    ports:
      - "5000:5000"
    volumes:
      - ./userModels:/app/shared # Keep shared models
      - ./backend/adminConfig:/app/config # Mount config directory
    restart: unless-stopped
